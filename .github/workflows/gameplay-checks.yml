name: Bloom RNG Gameplay Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/checks/**"
      - "tools/bloom-ui-editor/**"
      - "default.project.json"
      - ".github/workflows/gameplay-checks.yml"

concurrency:
  group: bloom-gameplay-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lua runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y liblua5.4-0

      - name: Validate check scripts
        run: python -m py_compile tools/checks/phase2a_check.py tools/checks/ui_startergui_audit.py tools/checks/ui_viewport_check.py tools/checks/core_loop_contract_check.py tools/checks/workshop_effects_check.py tools/checks/inventory_v2_actions_check.py tools/checks/core_progression_path_check.py tools/checks/bee_mastery_check.py tools/checks/remote_security_check.py

      - name: Bloom UI Studio JavaScript syntax
        run: node --check tools/bloom-ui-editor/app.js

      - name: Persistence and service harness
        run: python tools/checks/phase2a_check.py

      - name: Core loop contract
        run: python tools/checks/core_loop_contract_check.py

      - name: Workshop effect authority
        run: python tools/checks/workshop_effects_check.py

      - name: Inventory V2 action contract
        run: python tools/checks/inventory_v2_actions_check.py

      - name: Core progression reachability
        run: python tools/checks/core_progression_path_check.py

      - name: Bee Mastery contract
        run: python tools/checks/bee_mastery_check.py

      - name: Remote security contract
        run: python tools/checks/remote_security_check.py

      - name: Authored UI and integration audit
        run: python tools/checks/ui_startergui_audit.py

      - name: Desktop viewport geometry
        run: python tools/checks/ui_viewport_check.py
