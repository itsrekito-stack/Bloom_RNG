name: Bloom RNG Gameplay Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/checks/**"
      - "tools/bloom-ui-editor/**"
      - "default.project.json"
      - ".github/workflows/gameplay-checks.yml"

concurrency:
  group: bloom-gameplay-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rojo 7.7.0
        run: |
          curl -L https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip -o /tmp/rojo.zip
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          echo "/tmp/rojo" >> "$GITHUB_PATH"

      - name: Clean Rojo build
        run: |
          rojo --version
          rojo build default.project.json -o /tmp/BloomRNG.rbxl
          test -s /tmp/BloomRNG.rbxl


      - name: Install Lua runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y liblua5.4-0

      - name: Validate check scripts
        run: python -m py_compile tools/checks/phase2a_check.py tools/checks/studio_persistence_probe_check.py tools/checks/tutorial_acceptance_check.py tools/checks/workshop_ui_acceptance_check.py tools/checks/ui_startergui_audit.py tools/checks/ui_viewport_check.py tools/checks/core_loop_contract_check.py tools/checks/workshop_effects_check.py tools/checks/inventory_v2_actions_check.py tools/checks/core_progression_path_check.py tools/checks/bee_mastery_check.py tools/checks/remote_security_check.py tools/checks/legacy_cleanup_check.py tools/checks/roll_loop_contract_check.py tools/checks/garden_progression_check.py tools/checks/bee_runtime_check.py tools/checks/hive_location_progression_check.py tools/checks/workshop_tree_progression_check.py tools/checks/quests_trials_check.py tools/checks/season_legacy_check.py tools/checks/economy_balance_check.py tools/checks/progression_pacing_check.py tools/checks/rarity_duplicate_pacing_check.py tools/checks/release_content_lock_check.py tools/checks/release_preflight_check.py tools/checks/endgame_sinks_check.py tools/checks/loading_readiness_check.py tools/checks/ui_sync_merge_check.py tools/checks/ui_interaction_stability_check.py tools/checks/active_boosts_check.py

      - name: Bloom UI Studio JavaScript syntax
        run: node --check tools/bloom-ui-editor/app.js

      - name: Persistence and service harness
        run: python tools/checks/phase2a_check.py

      - name: Studio persistence probe contract
        run: python tools/checks/studio_persistence_probe_check.py

      - name: Tutorial acceptance contract
        run: python tools/checks/tutorial_acceptance_check.py

      - name: Workshop UI acceptance contract
        run: python tools/checks/workshop_ui_acceptance_check.py

      - name: Core loop contract
        run: python tools/checks/core_loop_contract_check.py

      - name: Workshop effect authority
        run: python tools/checks/workshop_effects_check.py

      - name: Inventory V2 action contract
        run: python tools/checks/inventory_v2_actions_check.py

      - name: Core progression reachability
        run: python tools/checks/core_progression_path_check.py

      - name: Bee Mastery contract
        run: python tools/checks/bee_mastery_check.py

      - name: Remote security contract
        run: python tools/checks/remote_security_check.py

      - name: Legacy cleanup contract
        run: python tools/checks/legacy_cleanup_check.py

      - name: Roll / Bloom / pity contract
        run: python tools/checks/roll_loop_contract_check.py

      - name: Garden progression contract
        run: python tools/checks/garden_progression_check.py

      - name: Bee runtime contract
        run: python tools/checks/bee_runtime_check.py

      - name: Hive / location progression contract
        run: python tools/checks/hive_location_progression_check.py

      - name: Workshop tree progression contract
        run: python tools/checks/workshop_tree_progression_check.py

      - name: Quests / activities / trials contract
        run: python tools/checks/quests_trials_check.py

      - name: Season / Legacy contract
        run: python tools/checks/season_legacy_check.py

      - name: Economy balance guardrails
        run: python tools/checks/economy_balance_check.py

      - name: Progression pacing guardrails
        run: python tools/checks/progression_pacing_check.py

      - name: Rarity / duplicate pacing guardrails
        run: python tools/checks/rarity_duplicate_pacing_check.py

      - name: Release content lock
        run: python tools/checks/release_content_lock_check.py

      - name: Static release preflight
        run: python tools/checks/release_preflight_check.py

      - name: Endgame duplicate sinks
        run: python tools/checks/endgame_sinks_check.py

      - name: Active boosts contract
        run: python tools/checks/active_boosts_check.py

      - name: Loading readiness contract
        run: python tools/checks/loading_readiness_check.py

      - name: UI sync merge contract
        run: python tools/checks/ui_sync_merge_check.py

      - name: UI interaction stability contract
        run: python tools/checks/ui_interaction_stability_check.py

      - name: Authored UI and integration audit
        run: python tools/checks/ui_startergui_audit.py

      - name: Desktop viewport geometry
        run: python tools/checks/ui_viewport_check.py

      - name: Package clean release candidate
        run: |
          mkdir -p /tmp/bloom-release
          cp /tmp/BloomRNG.rbxl /tmp/bloom-release/BloomRNG.rbxl
          sha256sum /tmp/bloom-release/BloomRNG.rbxl > /tmp/bloom-release/BloomRNG.rbxl.sha256
          printf '{"commit":"%s","ref":"%s","workflowRun":"%s","rojo":"7.7.0"}\n' "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" > /tmp/bloom-release/release-source.json

      - name: Upload clean release candidate
        uses: actions/upload-artifact@v4
        with:
          name: BloomRNG-clean-${{ github.sha }}
          path: /tmp/bloom-release/
          retention-days: 14
