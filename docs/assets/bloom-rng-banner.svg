<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Bloom RNG">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#0b1b2d"/>
      <stop offset="1" stop-color="#10263a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35d8ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#35d8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8df0ff"/>
      <stop offset=".55" stop-color="#47c8ff"/>
      <stop offset="1" stop-color="#8f7cff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#f2a62d"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="32" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="30.5" fill="none" stroke="#2bc8ff" stroke-opacity=".35" stroke-width="3"/>

  <circle cx="970" cy="180" r="190" fill="url(#glow)"/>
  <circle cx="925" cy="175" r="105" fill="#22c7ff" opacity=".08" filter="url(#softGlow)"/>

  <g transform="translate(915 178)">
    <ellipse rx="40" ry="85" transform="rotate(-38)" fill="url(#petal)" opacity=".95"/>
    <ellipse rx="40" ry="85" transform="rotate(38)" fill="url(#petal)" opacity=".95"/>
    <ellipse rx="40" ry="85" transform="rotate(142)" fill="url(#petal)" opacity=".88"/>
    <ellipse rx="40" ry="85" transform="rotate(-142)" fill="url(#petal)" opacity=".88"/>
    <circle r="34" fill="url(#gold)"/>
    <circle r="12" fill="#fff3b0" opacity=".9"/>
  </g>

  <g transform="translate(1040 82)">
    <ellipse cx="0" cy="0" rx="28" ry="18" fill="#ffc94a"/>
    <rect x="-12" y="-17" width="8" height="34" rx="4" fill="#3b2a24"/>
    <rect x="4" y="-17" width="8" height="34" rx="4" fill="#3b2a24"/>
    <ellipse cx="-18" cy="-18" rx="18" ry="9" transform="rotate(-28 -18 -18)" fill="#b9f4ff" opacity=".78"/>
    <ellipse cx="18" cy="-18" rx="18" ry="9" transform="rotate(28 18 -18)" fill="#b9f4ff" opacity=".78"/>
    <circle cx="-9" cy="-2" r="3.5" fill="#101820"/>
    <circle cx="9" cy="-2" r="3.5" fill="#101820"/>
  </g>

  <g fill="none" stroke="#27d4ff" stroke-opacity=".24">
    <path d="M735 64h78l39 68-39 68h-78l-39-68z"/>
    <path d="M792 215h78l39 68-39 68h-78l-39-68z"/>
    <path d="M1080 180h78l39 68-39 68h-78l-39-68z"/>
  </g>

  <text x="78" y="145" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="74" font-weight="800" letter-spacing="4">BLOOM RNG</text>
  <text x="82" y="195" fill="#66ddff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="2">ROLL • GROW • BLOOM</text>
  <text x="82" y="246" fill="#b7c7d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">A progression-focused Roblox simulator built around flowers, bees, gardens and Seasons.</text>

  <g transform="translate(82 284)">
    <rect width="170" height="38" rx="19" fill="#102d40" stroke="#2ed6ff" stroke-opacity=".55"/>
    <text x="85" y="25" text-anchor="middle" fill="#aeeeff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">ALPHA IN DEVELOPMENT</text>
  </g>
  <g transform="translate(266 284)">
    <rect width="130" height="38" rx="19" fill="#2b2414" stroke="#f4bb43" stroke-opacity=".65"/>
    <text x="65" y="25" text-anchor="middle" fill="#ffdc7c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">ROJO + LUAU</text>
  </g>
</svg>